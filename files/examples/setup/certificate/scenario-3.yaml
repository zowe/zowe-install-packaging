# >>>> Certificate setup scenario 3
# Zowe generated z/OS Keyring with Zowe generated certificates.
#
# Pre-requisite: your main zowe.yaml file is configured.
#
# To use this example, complete the configuration below and run 
#  `zwe init --create-certificate` or `zwe init certificate` with either:
#    - The contents of this file appended to your main 'zowe.yaml' file
#      OR
#    - The following configuration parameter, quotes included:
#      -c "FILE(/path/to/this/scenario-3.yaml):FILE(/path/to/zowe.yaml)"  
####

zowe:
  setup:
    dataset:
      # The prefix where datasets such as SZWESAMP can be found.
      prefix: IBMUSER.ZWEV3
      # JCL library where Zowe will store temporary JCLs during initialization
      jcllib: IBMUSER.ZWEV3.CUST.JCLLIB

    security:
      # This can be RACF, TSS, or ACF2
      product: RACF
      # Provide the user and group that will own the keyring
      users:
        zowe: ZWESVUSR
      groups:
        admin: ZWEADMIN

    certificate:
      type: JCERACFKS
      keyring:
        name: ZoweKeyring
        # label: localhost
        # # label of Zowe CA certificate. Optional, default value is localca.
        # caLabel: localca
      # # Distinguished name for Zowe generated certificates. All optional.
      # dname:
      #   caCommonName: ""
      #   commonName: ""
      #   orgUnit: ""
      #   org: ""
      #   locality: ""
      #   state: ""
      #   country: ""
      # # Validity days for Zowe generated certificates
      # validity: 3650
      # # Domain names and IPs should be added into certificate SAN
      # # If this field is not defined, `zwe init` command will use
      # # `zowe.externalDomains`.
      # # **NOTE**: due to the limitation of RACDCERT command, this field should
      # #           contain exactly 2 entries with the domain name and IP address.
      # san:
      #   - dvipa.my-company.com
      #   - 12.34.56.78
