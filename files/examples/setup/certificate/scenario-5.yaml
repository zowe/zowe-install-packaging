# >>>> Certificate setup scenario 5
# Zowe generated z/OS Keyring with importing certificate stored in data set
#
# Pre-requisite: your main zowe.yaml file is configured.
#
# To use this example, complete the configuration below and run
# `zwe init --create-certificate` or `zwe init certificate`
# with following configuration parameter, quotes included:
# -c "FILE(/path/to/this/scenario-5.yaml):FILE(/path/to/zowe.yaml)"
####

zowe:
  setup:
    certificate:
      type: JCERACFKS
      keyring:
        name: ZoweKeyring
        # Label of Zowe certificate. Optional, default value is localhost.
        label: localhost
        import:
          # Name of the data set holds the certificate issued by other CA.
          # This data set should be in PKCS12 format and contain private key.
          dsName: ""
          # Password for the PKCS12 data set.
          password: ""
