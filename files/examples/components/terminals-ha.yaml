#-------------------------------------------------------------------------------
# Zowe high availability instances customizations
#
# This section includes the customizations for each Zowe high availability instance
# and restricts outbound terminal connections for each HA instance.
#
# **NOTE**: Prefer one shared allowList and allowPorts under "components", see terminals.yaml. 
#           Use the haInstances override only when the instances really differ, 
#           for example when a target host is reachable only from some LPARs
#           because of firewall or network zones.
#-------------------------------------------------------------------------------
haInstances:
  lpar1:
    hostname: lpar1.example.com
    sysname: LPR1
    components:
      tn3270-ng2:
        allowList:
          - "*.example.com"
        allowPorts:
          - 23
          - 992
      vt-ng2:
        allowList:
          - "*.example.com"
        allowPorts:
          - 22
  lpar2:
    hostname: lpar2.example.com
    sysname: LPR2
    components:
      tn3270-ng2:
        allowList:
          - "lpar1.example.com"
          - "lpar2.example.com"
          - "lpar3.example.com"
        allowPorts:
          - 23
      vt-ng2:
        allowList:
          - "dev.example.com"
          - "qa.example.com"
        allowPorts:
          - 22
