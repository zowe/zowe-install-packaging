zowe:
  externalDomains:
  - {@ hostname @}
  setup:
    certificate:
      type: JCERACFKS
      keyring:
        caLabel: localca
        label: localhost
        name: ZoweKeyring
      san:
      - {@ hostname @}
    dataset:
      prefix: ZOWE.PR#4444
    jcl:
      enable: true
      header: '12345'
  runtimeDirectory: {@ ussTestDir @}
  workspaceDirectory: {@ zweWorkspaceDir @}

